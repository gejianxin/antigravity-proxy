[package]
name = "macos-proxy"
version = "2.5.0"
edition = "2021"
authors = ["Antigravity Contributors"]
description = "macOS Antigravity proxy dylib (DYLD_INSERT_LIBRARIES)"
license = "MIT"
publish = false

[lib]
name = "antigravity_proxy"
crate-type = ["cdylib"]

[dependencies]
agy-core = { path = "../agy-core" }

[target.'cfg(target_os = "macos")'.dependencies]
ctor = "0.2"
libc = "0.2"
