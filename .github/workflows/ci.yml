name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test
      - name: Release build
        run: cargo build --release
      - name: LD_PRELOAD smoke
        run: bash scripts/smoke.sh target/release/libantigravity_proxy.so
      - name: Staged config is present and not overwritten
        run: bash scripts/check-stage-config.sh
