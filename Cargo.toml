[package]
name = "antigravity-proxy"
version = "2.5.0"
edition = "2021"
authors = ["Antigravity Contributors"]
description = "Transparent network proxy interceptor for Antigravity Linux (x64 & arm64)"

[lib]
name = "antigravity_proxy"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
